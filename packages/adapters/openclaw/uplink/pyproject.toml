[project]
name = "artifex-nexus-openclaw-uplink"
version = "0.0.0"
description = "OpenClaw uplink adapter (Python, runs inside DCC) — chat WebSocket RPC + session"
requires-python = ">=3.11"
dependencies = [
    "artifex-nexus-core",
    "artifex-nexus-contracts",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus"]

[tool.uv.sources]
artifex-nexus-core = { workspace = true }
artifex-nexus-contracts = { workspace = true }
