[project]
name = "artifex-nexus-openclaw-wrapper"
version = "0.0.0"
description = "OpenClaw wrapper Python sidecar — JSON-RPC 2.0 over stdio, bootstrap, doctor, ports, runtime"
requires-python = ">=3.11"
dependencies = [
    "artifex-nexus-core",
    "artifex-nexus-contracts",
    "artifex-nexus-skill",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus"]

[tool.uv.sources]
artifex-nexus-core = { workspace = true }
artifex-nexus-contracts = { workspace = true }
artifex-nexus-skill = { workspace = true }
