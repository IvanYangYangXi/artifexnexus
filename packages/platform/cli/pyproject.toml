[project]
name = "artifex-nexus-cli"
version = "0.0.0"
description = "Artifex Nexus CLI — `artifex` command (skill / install / doctor / web)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "artifex-nexus-core",
    "artifex-nexus-skill",
]

[project.scripts]
artifex = "artifex_nexus.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus"]

[tool.uv.sources]
artifex-nexus-core = { workspace = true }
artifex-nexus-skill = { workspace = true }
