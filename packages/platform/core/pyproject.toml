[project]
name = "artifex-nexus-core"
version = "0.0.0"
description = "Artifex Nexus core: OpenClaw bridge protocol, config center, memory, health-check, integrity-check"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "pydantic>=2.8",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus"]
