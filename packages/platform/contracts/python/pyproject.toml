[project]
name = "artifex-nexus-contracts"
version = "0.0.0"
description = "Shared contracts: JSON Schemas + pydantic models + Python ABCs (PlatformAdapter / BaseDCCAdapter / StreamEvent / ExecutionContext)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus"]

[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "artifex_nexus/contracts/schemas"
