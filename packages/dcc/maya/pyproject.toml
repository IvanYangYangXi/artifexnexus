[project]
name = "artifex-nexus-maya"
version = "0.0.0"
description = "Artifex Nexus for Maya 2023+ — DCC plugin (MCP server + triggers)"
requires-python = ">=3.9"
dependencies = [
    "artifex-nexus-core",
    "artifex-nexus-skill",
    "artifex-nexus-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/artifex_nexus_maya"]

[tool.uv.sources]
artifex-nexus-core = { workspace = true }
artifex-nexus-skill = { workspace = true }
artifex-nexus-contracts = { workspace = true }
