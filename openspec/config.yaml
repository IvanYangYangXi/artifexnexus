schema: spec-driven

# ============================================================
# Artifex Nexus — OpenSpec 配置
# 本文件是 AI 助手的 spec-driven 开发入口。
# 所有 spec / task / decision 的权威源在 docs/（Obsidian Vault），
# 此处仅做索引引用，不复制内容。
# 最后更新：2026-05-28（全量对照代码功能更新）
# ============================================================

context: |
  ## 项目
  Artifex Nexus — AI Agent ↔ DCC 的桥（The AI-Agent Bridge for Digital Creation）。
  前身：artclaw_bridge（重构 fork）。
  目标平台：OpenClaw（唯一首发，vendor 锁定版本 v2026.5.4）。
  核心 DCC：Unreal Engine 5.7、Blender 5.1、Maya 2023+、3ds Max 2024+。
  Skill 覆盖：ComfyUI、Houdini、Substance Painter、Substance Designer、Unity。

  ## 技术栈
  - 前端：TypeScript (React, strict mode), Next.js 15, Tailwind CSS v4, @artifex-nexus/ui
  - 桌面壳：Tauri 2 (Rust), Vite 5
  - 后端/Python：Python 3.11+, pydantic v2, ruff (line-length=100), JSON-RPC 2.0 sidecar
  - DCC 插件：C++ (UE), Python (Blender/Maya/3ds Max addon)
  - 共享 SDK：packages/dcc/shared/artifex_nexus_sdk/
  - 仓库形态：monorepo (pnpm + Turborepo + uv workspaces)
  - 文档形态：Obsidian Vault (docs/)，单一信息源

  ## 架构关键词
  - 上行（聊天）：DCC → WebSocket RPC → OpenClaw Gateway
  - 下行（工具）：Gateway → MCP JSON-RPC → DCC MCP Server
  - 唯一 MCP 工具：run_python（Gateway 端自动加 mcp_<dcc>_ 前缀隔离）
  - Skill ≠ Tool：Skill 是包，Tool 是包内被 @skill_tool 装饰的函数
  - 契约即源：跨进程数据结构在 packages/platform/contracts/schemas/ 定义 JSON Schema，派生 Python/TS
  - SkillHub 全平台架构：共享核心 + DCC 特定注入（UE 独立实现因需要 unreal.DirectoryWatcher）

  ## 分层依赖（单向，禁止反向）
  apps/web → platform/contracts / platform/skill / platform/core
  platform/cli → platform/contracts / platform/skill / platform/core
  adapters/<platform> → platform/core + platform/contracts
  dcc/<dcc> → platform/core + platform/skill + platform/contracts + dcc/shared/artifex_nexus_sdk

  ## 端口分配
  - 18080: UE MCP Server
  - 18081: Maya MCP Server
  - 18082: 3ds Max MCP Server
  - 18083: Blender MCP Server
  - 18790: Next.js dev server
  - 19789: OpenClaw Gateway + Control UI

  ## 平台默认路径
  - 锚定 ~/.artifexnexus/
  - OpenClaw 隔离在 ~/.artifexnexus/.openclaw/
  - 禁止使用 ~/.openclaw/、~/.artclaw/ 等旧路径

  ## 开发流程
  - SDD 工作流：docs/development/sdd-workflow.md（/sdd triage|align|implement|done）
  - 任务三级体系：EPIC → STORY → TASK
  - 状态迁移三处同步铁律：文件位置 / frontmatter.status / board.md 列
  - 不允许 Agent 自标 done
  - GUI 任务必须先出 docs/specs/ui/<module>-structure.md，再写代码
  - 设计语言由 M3 统一（已完成：@artifex-nexus/ui, Tailwind v4, 27 个组件）

  ## 编码规范
  - 代码注释中文，公共 API docstring 中英双语
  - 代码文件 ≤ 500 行（黄金区 100–300）
  - 文档 ≤ 2000 字/文件
  - Conventional Commits
  - 零静默 catch，全量日志埋点

# ============================================================
# Spec 索引（权威源：docs/specs/）
# ============================================================
specs:
  - path: docs/specs/系统架构设计.md
    description: 系统架构设计（四层 SDK、上下行链路、MCP 工具最小化、多 DCC 支持）
  - path: docs/specs/openclaw-wrapper.md
    description: OpenClaw 包装器总览
  - path: docs/specs/openclaw-wrapper-install.md
