# ============================================================
# Per-artifact 规则
# ============================================================
rules:
  proposal:
    - 接单前必须先追问设计细节（Clarify-First），每问给推荐答案
    - 未达成共识前不动代码
  design:
    - 改架构必先改 docs/specs/，再改 packages/*
    - 重大决策必须新建 ADR 到 docs/decisions/
  specs:
    - 所有 spec 的权威源在 docs/specs/，openspec/specs/ 仅做 delta 索引
    - GUI spec 必须包含：信息架构 / 状态机 / 交互规则 / 线框 / 对接点
  tasks:
    - 任务三级体系 EPIC → STORY → TASK
    - 状态迁移必须同步三处：文件位置 / frontmatter.status / board.md
    - 不允许 Agent 自标 done
    - 代码文件 ≤ 500 行，文档 ≤ 2000 字
