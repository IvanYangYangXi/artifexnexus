  - path: docs/specs/openclaw-settings-panel.md
    description: OpenClaw 设置面板（9 大 LLM provider 矩阵 / 字段表 / 状态机 / sidecar 对接）
  - path: docs/specs/notification-system.md
    description: 通知系统设计（双通道：Tauri IPC + Gateway WS / 存储 / UI）
  - path: docs/specs/ui/design-language.md
    description: 设计语言规格（Tailwind v4 / CSS 变量 token / 组件规范）
  - path: docs/specs/ui/installer-structure.md
    description: 安装向导 UI 结构（信息架构 / 状态机 / 多 DCC 子项）

