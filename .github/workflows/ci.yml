name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --all-packages
      - run: uv run ruff check .
      - run: uv run pytest

  docs:
    name: Docs sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ADR numbering
        run: |
          ls docs/decisions/[0-9]*.md | awk -F/ '{print $NF}' | sort
      - name: Check required spec files exist
        run: |
          test -f "docs/vision/north-star.md"
          test -f "docs/specs/系统架构设计.md"
          test -f "docs/specs/skill-system.md"
          test -f "docs/specs/install.md"
          test -f "packages/platform/contracts/schemas/config.schema.json"
          test -f "packages/platform/contracts/schemas/manifest.schema.json"
