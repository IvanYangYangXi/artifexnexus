[package]
name = "artifex-nexus-desktop"
version = "0.0.0"
description = "Artifex Nexus Desktop Shell — Tauri 2 wrapper for OpenClaw"
authors = ["Ivan(杨己力)"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "artifex_nexus_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
